[package]
name = "agent-workbench-desktop"
version = "0.1.0"
description = "Native desktop shell for the Agent Desktop Workbench"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "agent_workbench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
